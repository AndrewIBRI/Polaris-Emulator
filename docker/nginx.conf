worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    server {
        listen 8080;
        server_name _;

        # ---- Octane client (static app) ----
        root /opt/dist;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---- runtime-generated client configuration ----
        # (client-mode.json, renderer-config.json, ui-config.json — written by the
        #  entrypoint on boot with the real domain; the baked copies from dist are
        #  copied over so pets.json / asset-loader.js keep working)
        location /configuration/ {
            alias /data/configuration/;
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }

        # ---- game assets (furni, clothes, pets, c_images, gamedata, icons, sounds) ----
        # Served under /gameassets/ so /assets/ stays free for the Vite client
        # bundle (Octane's loader probes /assets/index-<hash>.js in dist/assets/).
        # JSONs de gamedata (textos/config) NÃO podem herdar o cache de 7d: mudam
        # a cada deploy de tradução. Regex roda antes do prefix location.
        location ~ ^/gameassets(/gamedata/.+\.json)$ {
            alias /opt/assets$1;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        location /gameassets/ {
            alias /opt/assets/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # ---- imager output (group badges, camera photos, thumbnails) ----
        location /imager/ {
            alias /data/imager/;
            expires 5m;
        }

        # ---- Polaris WebSocket + HTTP API (auth, badges, CMS, health) ----
        location /ws {
            proxy_pass http://127.0.0.1:2096;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:2096;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /nitro-sec/ {
            proxy_pass http://127.0.0.1:2096;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # health check for the panel
        location = /healthz {
            proxy_pass http://127.0.0.1:2096/api/health;
        }

        # Beacon de erros do cliente (window.onerror manda GET aqui; some no access log)
        location = /__clienterr {
            return 204;
        }
    }
}
