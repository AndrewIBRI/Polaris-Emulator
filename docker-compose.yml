# Stack canônico do Polaris Hotel — sobe TUDO com um comando (hotel + banco + voz).
#
#   docker compose up -d --build
#
# Tudo funciona sem .env (fallbacks inline) e o primeiro boot gera todas as
# secrets sozinho (secret do LiveKit fica em /data/secrets/livekit-api-secret,
# no volume compartilhado).
#
# No EasyPanel (serviço do tipo Compose, source Git = este repo):
# - SEM `ports` no hotel (o painel valida: porta publicada colide com o host).
#   O domínio é criado na aba Domains → alvo `hotel`, porta 8080.
# - O `livekit` publica TCP 7881 + UDP 50000-50100 no host (WebRTC precisa de
#   portas reais no host — é serviço não-HTTP, permitido pelo painel).
# - `build: .` só é usado no deploy local; no EasyPanel é o mesmo Dockerfile
#   buildado pelo `docker compose up --build`.

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-polaris-root-2026}
      MARIADB_DATABASE: ${DB_NAME:-polaris}
      MARIADB_USER: ${DB_USER:-polaris}
      MARIADB_PASSWORD: ${DB_PASSWORD:-polaris-2026}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 12

  # Um-shot: importa o schema+dados (CleanDB) e o seed pt-BR (traduções,
  # catálogo, salas, contas) no primeiro boot, só se o banco estiver vazio.
  db-init:
    image: mariadb:11.4
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-polaris-root-2026}
      DB_NAME: ${DB_NAME:-polaris}
    volumes:
      - ./Database:/seed:ro
    command:
      - |
        until mariadb -h db -uroot -p"$$MARIADB_ROOT_PASSWORD" -e "SELECT 1" >/dev/null 2>&1; do sleep 3; done
        N=$$(mariadb -h db -uroot -p"$$MARIADB_ROOT_PASSWORD" "$$DB_NAME" -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='$$DB_NAME'")
        if [ "$$N" -gt 0 ]; then echo "[db-init] banco já tem $$N tabelas — pulando import"; exit 0; fi
        mariadb -h db -uroot -p"$$MARIADB_ROOT_PASSWORD" "$$DB_NAME" < /seed/"Default Database"/CleanDB.sql
        mariadb -h db -uroot -p"$$MARIADB_ROOT_PASSWORD" "$$DB_NAME" < /seed/pt-br/seed.sql
        echo "[db-init] schema + seed pt-BR importados"

  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    # Espera a secret gerada pelo primeiro boot do hotel e sobe com ela.
    entrypoint: [ "/bin/sh", "-c", "until [ -s /data/secrets/livekit-api-secret ]; do sleep 2; done; LIVEKIT_KEYS=\"${LIVEKIT_API_KEY:-polaris}: $$(cat /data/secrets/livekit-api-secret)\" exec /livekit-server --config=/etc/livekit/livekit.yaml" ]
    volumes:
      - hotel-data:/data
      - ./docker/livekit.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      - "7881:7881/tcp"
      - "50000-50100:50000-50100/udp"

  hotel:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      APP_SCHEME: ${APP_SCHEME:-http}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-polaris}
      DB_USER: ${DB_USER:-polaris}
      DB_PASSWORD: ${DB_PASSWORD:-polaris-2026}
      JAVA_XMX: ${JAVA_XMX:-3072m}
    volumes:
      - hotel-data:/data
    # Sem ports no hotel: o roteamento público é feito pelo EasyPanel
    # (aba Domains → alvo `hotel`, porta 8080) ou pelo nginx do host.
    expose:
      - "8080"

volumes:
  db-data:
  hotel-data:
